[package]
name = "codex-bridge"
version = "0.2.0"
edition = "2021"
description = "Minimal passthrough proxy to the ChatGPT Codex backend with automatic OAuth token refresh"
license = "MIT"

[lib]
name = "codex_bridge"
path = "src/lib.rs"

[[bin]]
name = "codex-bridge"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "sync", "io-std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
rmcp = { version = "3.5.0", default-features = false, features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
